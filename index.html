<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>StudyOS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="brand">StudyOS</div>
  <nav>
    <button data-go="today">Today</button>
    <button data-go="calendar">Calendar</button>
    <button data-go="subjects">Subjects</button>
    <button data-go="settings">Settings</button>
  </nav>
</header>

<main>
<section id="today" class="hero section">
  <div class="hero-orb orb-a"></div>
  <div class="hero-orb orb-b"></div>
  <div class="eyebrow">2027 NYCU Graduate Exam</div>
  <h1 class="hero-title"><span id="daysLeft">—</span><small>days left</small><br><em>Today matters.</em></h1>
  <p id="todayLabel" class="sub"></p>
  <div id="todayTasks" class="today-grid"></div>
  <div class="hero-meta">
    <div><span>今日剩餘</span><strong id="todayRemaining">0 分鐘</strong></div>
    <div><span>連續完成</span><strong id="streak">0 天</strong></div>
  </div>
  <div class="scroll-cue"><span>Scroll to explore</span><b>↓</b></div>
</section>

<section id="dashboard" class="section reveal">
  <div class="section-head sticky-copy"><span>Progress</span><h2>讓每一次完成，<br>都推動下一步。</h2></div>
  <div class="stats">
    <article class="glass"><span>本週完成率</span><strong id="weekRate">0%</strong><div class="bar"><i id="weekBar"></i></div></article>
    <article class="glass"><span>目前狀態</span><strong id="deltaText">準時</strong><p id="deltaSubjects"></p></article>
    <article class="glass"><span>明日預告</span><strong id="tomorrowTitle">—</strong><p id="tomorrowDetail"></p></article>
  </div>
  <div id="subjectProgress" class="progress-list"></div>
</section>

<section id="calendar" class="section reveal">
  <div class="section-head sticky-copy"><span>Calendar</span><h2>行程改變，<br>計畫跟著改變。</h2></div>
  <div class="calendar-wrap glass">
    <div class="calendar-toolbar"><button id="prevMonth">←</button><h3 id="monthLabel"></h3><button id="nextMonth">→</button></div>
    <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>
  <div class="note-editor glass">
    <h3 id="noteDate">選擇日期</h3>
    <textarea id="noteInput" placeholder="輸入備註，例如：加班、聚餐、學校考試……"></textarea>
    <div class="row"><label>當日可讀分鐘 <input id="capacityInput" type="number" min="0" step="15"></label><button id="saveNote">儲存並重新排程</button></div>
  </div>
</section>

<section id="subjects" class="section reveal">
  <div class="section-head sticky-copy"><span>Subjects</span><h2>五科進度，<br>一眼掌握。</h2></div>
  <div id="subjectAccordion" class="accordion"></div>
</section>

<section id="settings" class="section reveal">
  <div class="section-head"><span>Settings</span><h2>你的節奏，由你決定。</h2></div>
  <div class="settings-card glass">
    <label>開始日期 <input id="startDate" type="date"></label>
    <label>考試日期 <input id="examDate" type="date"></label>
    <label>平日可讀分鐘 <input id="weekdayCap" type="number" min="0"></label>
    <label>星期六可讀分鐘 <input id="saturdayCap" type="number" min="0"></label>
    <label>星期日 <select id="sundayMode"><option value="0">固定休息</option><option value="180">可讀 180 分鐘</option></select></label>
    <button id="saveSettings">儲存設定並重排</button>
    <button id="resetAll" class="ghost">重設全部資料</button>
  </div>
</section>
</main>

<div id="toast" class="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script>
</body></html>
